name: Mobile - Expo Build & Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - 'mobile-sdk/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Expo EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Login to Expo
        run: eas login --token ${{ secrets.EXPO_TOKEN }}

      - name: Build Android Preview
        working-directory: ./mobile
        run: eas build --platform android --profile preview --non-interactive

      - name: Build iOS Preview
        working-directory: ./mobile
        run: eas build --platform ios --profile preview --non-interactive

      - name: Create EAS Update (for OTA)
        working-directory: ./mobile
        run: eas update --channel preview --non-interactive

      - name: Comment build links on PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🚀 Mobile builds ready!
            Android: Check Expo dashboard
            iOS: Check Expo dashboard
            OTA Update: https://expo.dev/@yourusername/intelliflow-mobile