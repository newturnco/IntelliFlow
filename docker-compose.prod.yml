
#### `docker-compose.prod.yml`
```yaml
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: intelliflow-postgres
    environment:
      POSTGRES_DB: intelliflow
      POSTGRES_USER: intelliflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliflow"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intelliflow-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelliflow-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://intelliflow:${DB_PASSWORD}@postgres:5432/intelliflow
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - STORAGE_PROVIDER=${STORAGE_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
      - AZURE_STORAGE_ACCOUNT_NAME=${AZURE_STORAGE_ACCOUNT_NAME}
      - AZURE_STORAGE_ACCOUNT_KEY=${AZURE_STORAGE_ACCOUNT_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelliflow-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.your-domain.com
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: intelliflow-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot:/etc/letsencrypt
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

    temporal:
    image: temporalio/auto-setup:1.24
    container_name: intelliflow-temporal
    environment:
      - DB=postgresql
      - DB_ADDR=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"
    depends_on:
      - postgres

  temporal-worker:
    build: ./backend
    command: python -m app.services.temporal_worker
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal